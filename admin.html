<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .admin-container { width: 100%; max-width: 600px; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); padding: 30px; box-sizing: border-box; }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        .card { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.1rem; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        .btn-shutdown { background: #ef4444; color: white; }
        .btn-shutdown:hover { background: #dc2626; }
        .btn-refresh { background: #3b82f6; color: white; }
        .btn-refresh:hover { background: #2563eb; }
        #statusMessage { margin-top: 15px; text-align: center; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>🛡️ Server Admin Control Panel</h2>
        
        <div class="card">
            <div class="stat-row"><span>Server Status:</span> <span id="serverStatus" style="color: #4ade80;">Checking...</span></div>
            <div class="stat-row"><span>Lifetime Memory Concepts:</span> <span id="memorySize">0</span></div>
        </div>

        <div class="btn-group">
            <button class="btn-refresh" onclick="fetchServerStatus()">Refresh Status</button>
            <button class="btn-shutdown" onclick="shutdownServer()">Shutdown Server</button>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        async function fetchServerStatus() {
            const statusEl = document.getElementById('serverStatus');
            const memoryEl = document.getElementById('memorySize');
            const msgEl = document.getElementById('statusMessage');

            try {
                const response = await fetch('/health');
                const data = await response.json();
                if (response.ok) {
                    statusEl.innerText = "Online & Healthy";
                    statusEl.style.color = "#4ade80";
                    memoryEl.innerText = data.memory_size || 0;
                    msgEl.innerText = "";
                } else {
                    statusEl.innerText = "Error";
                    statusEl.style.color = "#f87171";
                }
            } catch (error) {
                statusEl.innerText = "Offline / Unreachable";
                statusEl.style.color = "#f87171";
                memoryEl.innerText = "N/A";
            }
        }

        async function shutdownServer() {
            if (!confirm("Are you sure you want to turn off the server process? (Render will automatically restart it if configured, or keep it stopped until manual boot).")) return;

            const msgEl = document.getElementById('statusMessage');
            msgEl.style.color = "#f87171";
            msgEl.innerText = "Sending shutdown command...";

            try {
                const response = await fetch('/admin/shutdown', { method: 'POST' });
                const data = await response.json();
                msgEl.innerText = data.message || "Server shut down.";
                document.getElementById('serverStatus').innerText = "Offline";
                document.getElementById('serverStatus').style.color = "#f87171";
            } catch (error) {
                msgEl.innerText = "Server shut down successfully (connection dropped).";
                document.getElementById('serverStatus').innerText = "Offline";
                document.getElementById('serverStatus').style.color = "#f87171";
            }
        }

        // Load stats on page open
        fetchServerStatus();
    </script>
</body>
</html>
