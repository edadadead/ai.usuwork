<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render AI - Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .admin-container { width: 100%; max-width: 500px; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; }
        .admin-header { background: #0284c7; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .admin-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #334155; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 5px; }
        .card-title { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
        .card-value { font-size: 1.2rem; color: #f8fafc; font-weight: bold; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
        .btn-danger:hover { background: #dc2626; }
        .btn-refresh { background: #0284c7; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: background 0.2s; }
        .btn-refresh:hover { background: #0369a1; }
        .status-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #22c55e; margin-right: 6px; }
        .status-offline { background: #ef4444; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">🛠️ Server Admin Dashboard</div>
        <div class="admin-body">
            <div class="card">
                <span class="card-title">Server Status</span>
                <span class="card-value" id="serverStatus"><span class="status-indicator" id="statusDot"></span>Checking...</span>
            </div>
            
            <div class="card">
                <span class="card-title">Brain Memory Size (`brain.json`)</span>
                <span class="card-value" id="memorySize">Loading...</span>
            </div>

            <button class="btn-refresh" onclick="fetchHealth()">🔄 Refresh Status</button>

            <button class="btn-danger" onclick="shutdownServer()">⚠️ Shutdown Server Process</button>
        </div>
    </div>

    <script>
        async function fetchHealth() {
            const statusEl = document.getElementById('serverStatus');
            const statusDot = document.getElementById('statusDot');
            const memoryEl = document.getElementById('memorySize');

            try {
                const response = await fetch('/health');
                const data = await response.json();
                
                if (response.ok && data.status === 'healthy') {
                    statusDot.className = "status-indicator";
                    statusEl.innerHTML = `<span class="status-indicator"></span> Online & Active`;
                    memoryEl.innerText = `${data.memory_size} concepts stored`;
                } else {
                    throw new Error("Unhealthy response");
                }
            } catch (err) {
                statusDot.className = "status-indicator status-offline";
                statusEl.innerHTML = `<span class="status-indicator status-offline"></span> Offline / Unreachable`;
                memoryEl.innerText = "Unavailable";
            }
        }

        async function shutdownServer() {
            if (!confirm("Are you sure you want to trigger a remote shutdown of the Render server process?")) {
                return;
            }

            try {
                const response = await fetch('/admin/shutdown', { method: 'POST' });
                const data = await response.json();
                alert(data.message || "Shutdown command sent.");
                document.getElementById('serverStatus').innerHTML = `<span class="status-indicator status-offline"></span> Terminated`;
            } catch (err) {
                alert("Failed to send shutdown command.");
            }
        }

        // Fetch health stats on page load
        fetchHealth();
    </script>
</body>
</html>
