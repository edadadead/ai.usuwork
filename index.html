<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render Server AI Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; height: 80vh; }
        .chat-header { background: #0284c7; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 6px; max-width: 80%; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
        .user-message { background: #0369a1; align-self: flex-end; color: #f0f9ff; }
        .ai-message { background: #334155; align-self: flex-start; color: #f8fafc; }
        .chat-input-area { display: flex; border-top: 1px solid #475569; padding: 10px; background: #1e293b; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 4px; outline: none; font-size: 1rem; }
        .chat-input-area button { background: #0284c7; color: white; border: none; padding: 10px 20px; margin-left: 8px; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .chat-input-area button:hover { background: #0369a1; }
        .stats-footer { padding: 8px; background: #0f172a; text-align: center; font-size: 0.8rem; color: #38bdf8; border-top: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">🤖 Render Server AI (Connected via API)</div>
        <div id="chatMessages" class="chat-messages">
            <div class="message ai-message">Hello! I am your AI running live on your Render server with persistent memory. How can I help you today?</div>
        </div>
        <div id="statsFooter" class="stats-footer">Memory: Ready</div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('chatMessages');
        const inputField = document.getElementById('userInput');
        const statsFooter = document.getElementById('statsFooter');

        async function sendMessage() {
            const prompt = inputField.value.trim();
            if (!prompt) return;

            messagesContainer.innerHTML += `<div class="message user-message">${escapeHtml(prompt)}</div>`;
            inputField.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            const aiMsgId = 'ai-' + Date.now();
            messagesContainer.innerHTML += `<div id="${aiMsgId}" class="message ai-message">Thinking...</div>`;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            const aiMsgEl = document.getElementById(aiMsgId);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                if (response.ok) {
                    aiMsgEl.innerText = data.response;
                    if (data.brain_stats) {
                        statsFooter.innerText = data.brain_stats;
                    }
                } else {
                    aiMsgEl.innerText = "Error: " + (data.error || "Unknown error");
                    aiMsgEl.style.color = "#f87171";
                }
            } catch (err) {
                aiMsgEl.innerText = "Network Error: Could not connect to Render server.";
                aiMsgEl.style.color = "#f87171";
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
