<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 80vh; }
        .chat-header { background: #4f46e5; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 6px; max-width: 80%; line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
        .user-message { background: #e0e7ff; align-self: flex-end; color: #1e1b4b; }
        .ai-message { background: #f3f4f6; align-self: flex-start; color: #1f2937; }
        .chat-input-area { display: flex; border-top: 1px solid #e5e7eb; padding: 10px; background: #fff; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; outline: none; font-size: 1rem; }
        .chat-input-area button { background: #4f46e5; color: white; border: none; padding: 10px 20px; margin-left: 8px; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .chat-input-area button:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">🤖 Smart AI Assistant (Live on Render)</div>
        <div id="chatMessages" class="chat-messages">
            <div class="message ai-message">Hello! I'm your AI running live on your server. How can I help you today?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messagesContainer = document.getElementById('chatMessages');
            const prompt = inputField.value.trim();

            if (!prompt) return;

            // Append user message
            messagesContainer.innerHTML += `<div class="message user-message">${escapeHtml(prompt)}</div>`;
            inputField.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Append temporary loading message
            const loadingId = 'loading-' + Date.now();
            messagesContainer.innerHTML += `<div id="${loadingId}" class="message ai-message">Thinking...</div>`;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await response.json();

                document.getElementById(loadingId).remove();

                if (data.response) {
                    messagesContainer.innerHTML += `<div class="message ai-message">${escapeHtml(data.response)}</div>`;
                } else {
                    messagesContainer.innerHTML += `<div class="message ai-message" style="color: red;">Error: ${escapeHtml(data.error || 'Unknown error')}</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                messagesContainer.innerHTML += `<div class="message ai-message" style="color: red;">Network error connecting to AI.</div>`;
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
